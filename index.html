<title>Mar's Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=Karla:wght@400;500;700&family=Caveat:wght@600;700&display=swap">
<style>
  :root{
    --sky:#d7ecf5;
    --cream:#fbf7ec;
    --meadow:#6a9450;
    --meadow-deep:#3f6b34;
    --petal:#f2a9b5;
    --petal-deep:#e2788a;
    --sun:#eab54c;
    --amber:#c17a2e;
    --text:#453a29;
    --muted:#7d7059;
    --muted-dim:#ddd3ba;
    --card-bg:rgba(255,255,255,0.68);
    --card-border:rgba(79,122,62,0.28);
    --focus:#c17a2e;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto;} }

  body{
    margin:0;
    background:linear-gradient(180deg, var(--sky) 0%, var(--cream) 42%, var(--cream) 100%);
    color:var(--text);
    font-family:"Karla","Segoe UI","Helvetica Neue",Arial,sans-serif;
    padding:0 20px 64px;
    position:relative;
    min-height:100vh;
    overflow-x:hidden;
  }

  #ambient{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;
  }

  .glow{
    position:fixed;
    z-index:0;
    border-radius:50%;
    filter:blur(60px);
    pointer-events:none;
  }
  .glow--sun{
    width:460px;height:460px;
    top:0%; left:50%; transform:translateX(-50%);
    background:radial-gradient(circle, rgba(234,181,76,0.28), transparent 70%);
  }
  .glow--cloud{
    width:380px;height:260px;
    top:10%; left:4%;
    background:radial-gradient(circle, rgba(255,255,255,0.55), transparent 70%);
  }
  .glow--cloud2{
    width:320px;height:220px;
    top:4%; left:66%;
    background:radial-gradient(circle, rgba(255,255,255,0.45), transparent 70%);
  }

  .sun{
    position:fixed;
    z-index:0;
    top:6%; left:50%;
    transform:translateX(-50%);
    width:84px; height:84px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff6dd, var(--sun) 70%);
    filter:drop-shadow(0 0 26px rgba(234,181,76,0.55));
    pointer-events:none;
  }

  .horizon{
    position:relative;
    width:calc(100% + 40px);
    margin:64px -20px 0;
    height:130px;
    pointer-events:none;
  }
  .horizon svg{ width:100%; height:100%; display:block; }

  .wolf{
    position:absolute;
    bottom:14px; left:84%;
    transform:translateX(-50%);
    font-size:clamp(52px, 11vw, 84px);
    line-height:1;
    filter:grayscale(1) brightness(0.08) drop-shadow(2px 6px 4px rgba(63,107,52,0.35));
    pointer-events:none;
    user-select:none;
  }

  main, header, footer{ position:relative; z-index:1; }

  .wrap{ max-width:720px; margin:0 auto; }

  header.hero{
    padding-top:56px;
    text-align:center;
  }

  .photo-frame-wrap{
    position:relative;
    width:160px;
    margin:0 auto 22px;
  }

  .wolf-peek{
    position:absolute;
    bottom:-16px;
    right:-16px;
    font-size:2.1rem;
    line-height:1;
    filter:grayscale(1) brightness(0.08) drop-shadow(1px 3px 2px rgba(63,107,52,0.35));
    pointer-events:none;
    user-select:none;
  }

  .photo-frame{
    width:160px;
    height:160px;
    margin:0;
    border-radius:10px;
    background:linear-gradient(160deg, rgba(255,255,255,0.9), rgba(255,255,255,0.5));
    border:6px solid #fffdf8;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    transform:rotate(-2.5deg);
    box-shadow:0 18px 40px rgba(63,107,52,0.2);
  }
  .photo-frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .photo-frame span{
    font-size:0.72rem;
    line-height:1.4;
    color:var(--muted);
    text-align:center;
    padding:0 14px;
    font-family:"Karla",sans-serif;
  }

  .eyebrow{
    font-family:"Caveat","Segoe Script",cursive;
    font-size:1.7rem;
    font-weight:700;
    color:var(--amber);
    margin:0 0 4px;
    letter-spacing:0.01em;
  }

  h1{
    font-family:"Fraunces","Iowan Old Style",Georgia,serif;
    font-style:italic;
    font-weight:600;
    font-size:clamp(2.2rem, 5.2vw, 3.2rem);
    letter-spacing:-0.01em;
    margin:0 0 12px;
    color:var(--text);
    text-wrap:balance;
  }

  .anniversary-note{
    font-size:0.85rem;
    color:var(--muted);
    margin:0 0 32px;
    font-variant-numeric:tabular-nums;
  }

  nav.tabs{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-bottom:36px;
  }
  nav.tabs button{
    font-family:"Karla",sans-serif;
    font-size:0.92rem;
    font-weight:700;
    letter-spacing:0.02em;
    color:var(--muted);
    background:rgba(255,255,255,0.5);
    border:1px solid var(--muted-dim);
    border-radius:999px;
    padding:9px 20px;
    cursor:pointer;
    transition:color 0.2s, border-color 0.2s, background 0.2s;
  }
  nav.tabs button[aria-selected="true"]{
    color:var(--text);
    background:var(--sun);
    border-color:var(--sun);
  }
  nav.tabs button:hover{ border-color:var(--meadow); color:var(--meadow-deep); }
  nav.tabs button:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
  nav.tabs button[aria-selected="true"]:hover{ color:var(--text); }

  /* ---- Today panel ---- */

  .bonus-banner{
    text-align:center;
    font-family:"Cormorant Garamond",Georgia,serif;
    font-style:italic;
    font-size:1.15rem;
    color:var(--text);
    background:linear-gradient(120deg, var(--sun), var(--petal));
    border-radius:16px;
    padding:16px 22px;
    margin:0 0 24px;
    box-shadow:0 12px 30px rgba(234,181,76,0.25);
  }

  .status-row{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:18px;
    flex-wrap:wrap;
    margin-bottom:22px;
    font-family:"Caveat",cursive;
    font-weight:600;
    font-size:1.3rem;
    color:var(--muted);
  }
  .status-row .pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .status-row svg{ width:20px; height:20px; flex:none; }

  .today-card{
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:22px;
    padding:36px 36px 40px;
    text-align:center;
    box-shadow:0 24px 48px rgba(74,60,44,0.12), 0 0 60px rgba(234,181,76,0.12);
  }

  .flower-hero{
    width:min(150px, 55%);
    margin:0 auto 8px;
    display:block;
    animation:unfurl 900ms ease-out;
    transform-origin:60px 60px;
  }
  @keyframes unfurl{
    from{ opacity:0.4; transform:scale(0.6) rotate(-6deg); }
    to{ opacity:1; transform:scale(1) rotate(0deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .flower-hero{ animation:none; }
  }

  .reveal-trigger{
    display:block;
    width:100%;
    background:none;
    border:none;
    padding:0;
    margin:0;
    font-family:inherit;
    color:inherit;
    cursor:pointer;
    transition:transform 0.2s;
  }
  .reveal-trigger:hover{ transform:scale(1.02); }
  .reveal-trigger:focus-visible{ outline:2px solid var(--focus); outline-offset:6px; border-radius:16px; }
  .reveal-trigger .bud-hero{
    width:min(120px, 45%);
    margin:0 auto 10px;
    display:block;
    animation:sway 3.4s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce){
    .reveal-trigger .bud-hero{ animation:none; }
  }
  @keyframes sway{
    0%, 100%{ transform:rotate(-2deg); }
    50%{ transform:rotate(2deg); }
  }
  .reveal-trigger .cta{
    margin:8px 0 0;
    font-family:"Karla",sans-serif;
    font-weight:700;
    font-size:0.95rem;
    color:var(--amber);
  }

  .garden-hint{
    text-align:center;
    font-size:0.85rem;
    color:var(--muted);
    margin:-10px 0 22px;
  }

  .milestone-flag{
    display:inline-block;
    font-family:"Karla",sans-serif;
    font-size:0.72rem;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text);
    background:var(--petal);
    border-radius:999px;
    padding:5px 14px;
    margin-bottom:18px;
  }

  .today-card .day-count{
    font-family:"Karla",sans-serif;
    font-size:0.78rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--muted);
    margin:6px 0 18px;
    font-variant-numeric:tabular-nums;
  }

  .today-card p.thing{
    font-family:"Fraunces",Georgia,serif;
    font-weight:500;
    font-size:clamp(1.55rem, 4vw, 2.05rem);
    line-height:1.42;
    color:var(--text);
    margin:0;
    text-wrap:balance;
  }

  .today-card .hint{
    margin:26px 0 0;
    font-size:0.85rem;
    color:var(--muted);
  }

  .example-caption{
    max-width:52ch;
    margin:22px auto 0;
    text-align:center;
    font-size:0.82rem;
    color:var(--muted);
    line-height:1.5;
  }
  .example-caption em{ color:var(--amber); font-style:italic; }

  .coming-soon{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
    font-family:"Fraunces",Georgia,serif;
    font-style:italic;
    font-weight:500;
    font-size:1.35rem;
  }

  /* ---- Garden panel ---- */

  .sky-progress{
    text-align:center;
    font-size:0.85rem;
    color:var(--muted);
    margin-bottom:22px;
    font-variant-numeric:tabular-nums;
  }

  .constellation-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(38px, 1fr));
    gap:12px;
    padding:0;
    margin:0 0 28px;
  }

  .star-node{
    background:transparent;
    border:none;
    padding:6px;
    cursor:default;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:8px;
  }
  .star-node svg{ width:20px; height:20px; }
  .star-node.lit{ cursor:pointer; }
  .star-node.lit svg{ filter:drop-shadow(0 1px 3px rgba(226,120,138,0.5)); }
  .star-node.lit:hover, .star-node.lit:focus-visible{ background:rgba(234,181,76,0.16); }
  .star-node:focus-visible{ outline:2px solid var(--focus); outline-offset:1px; }
  .star-node.locked{ opacity:0.7; }

  #dayDetail{
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:18px;
    padding:28px 30px;
    margin-bottom:28px;
    text-align:center;
  }
  #dayDetail .day-count{
    font-family:"Karla",sans-serif;
    font-size:0.78rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 12px;
  }
  #dayDetail p.thing{
    font-family:"Fraunces",Georgia,serif;
    font-weight:500;
    font-size:1.45rem;
    color:var(--text);
    margin:0 0 16px;
    line-height:1.42;
    text-wrap:balance;
  }
  #dayDetail button.close{
    background:transparent;
    border:1px solid var(--muted-dim);
    color:var(--muted);
    border-radius:999px;
    padding:6px 16px;
    font-size:0.8rem;
    cursor:pointer;
  }
  #dayDetail button.close:hover{ border-color:var(--meadow); color:var(--meadow-deep); }
  #dayDetail button.close:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }

  .legend{
    display:flex;
    justify-content:center;
    gap:22px;
    flex-wrap:wrap;
    font-size:0.78rem;
    color:var(--muted);
  }
  .legend .pill{ display:inline-flex; align-items:center; gap:6px; }
  .legend svg{ width:16px; height:16px; }

  footer{
    text-align:center;
    margin-top:56px;
    font-family:"Caveat",cursive;
    font-weight:600;
    font-size:1.15rem;
    color:var(--muted);
  }

  @media (max-width:420px){
    .today-card{ padding:30px 22px 34px; }
    header.hero{ padding-top:40px; }
  }
</style>

<div id="ambient" aria-hidden="true"></div>
<div class="glow glow--sun" aria-hidden="true"></div>
<div class="glow glow--cloud" aria-hidden="true"></div>
<div class="glow glow--cloud2" aria-hidden="true"></div>
<div class="sun" aria-hidden="true"></div>

<div class="wrap">
  <header class="hero">
    <div class="photo-frame-wrap">
      <div class="photo-frame">
        <img src="photo.webp" alt="The two of us on a video call, right after the flowers arrived">
      </div>
      <div class="wolf-peek" aria-hidden="true">🐺</div>
    </div>
    <p class="eyebrow" id="greeting">Hey, Honeybee</p>
    <h1>100 things I love about you</h1>
    <p class="anniversary-note" id="annNote"></p>

    <nav class="tabs" role="tablist" aria-label="View">
      <button id="tabTonight" role="tab" aria-selected="true" aria-controls="panelTonight">Today</button>
      <button id="tabGarden" role="tab" aria-selected="false" aria-controls="panelGarden">The Garden</button>
    </nav>
  </header>

  <main>
    <section id="panelTonight" role="tabpanel" aria-labelledby="tabTonight">
      <div id="bonusBanner" class="bonus-banner" hidden></div>
      <div id="tonightContent"></div>
    </section>

    <section id="panelGarden" role="tabpanel" aria-labelledby="tabGarden" hidden>
      <p class="sky-progress" id="skyProgress"></p>
      <p class="garden-hint">Click any bloomed flower below to read it again 🌸</p>
      <div id="dayDetail" hidden tabindex="-1">
        <p class="day-count" id="detailDayCount"></p>
        <p class="thing" id="detailThing"></p>
        <button class="close" id="detailClose" type="button">Close</button>
      </div>
      <div class="constellation-grid" id="constellationGrid"></div>
      <div class="legend">
        <span class="pill" id="legendBloom"></span>
        <span class="pill" id="legendBud"></span>
      </div>
      <p class="example-caption">everyday you open this, i buy you starbucks &lt;3</p>
    </section>
  </main>

  <footer>&mdash; every word of it true &mdash;</footer>
</div>

<div class="horizon" aria-hidden="true">
  <svg viewBox="0 0 400 120" preserveAspectRatio="none">
    <path d="M0,120 L0,80 C30,65 55,82 85,70 C110,60 120,56 150,56 L230,56 C255,56 270,63 300,72 C330,82 360,68 400,64 L400,120 Z" fill="#6a9450"/>
    <g fill="#3f6b34" opacity="0.55">
      <ellipse cx="55" cy="76" rx="16" ry="9"/>
      <ellipse cx="70" cy="72" rx="12" ry="7"/>
      <ellipse cx="285" cy="78" rx="15" ry="8"/>
      <ellipse cx="385" cy="62" rx="13" ry="7"/>
    </g>
    <g fill="#fbf7ec" opacity="0.85">
      <circle cx="45" cy="85" r="2.4"/>
      <circle cx="120" cy="78" r="2"/>
      <circle cx="200" cy="88" r="2.4"/>
      <circle cx="260" cy="82" r="2"/>
      <circle cx="330" cy="90" r="2.4"/>
    </g>
  </svg>
  <div class="wolf" aria-hidden="true">🐺</div>
</div>

<script>
(function(){

  /* =====================================================================
     EDIT ME — personalize this section, then everything below just works.
     ===================================================================== */

  var HER_NAME   = "Mar";
  var PET_NAMES  = ["Honeybee", "pretty girl"];

  // The day this site goes live for her. Day 1 lands on this date.
  // Format: "YYYY-MM-DD". Change this to whenever you actually send the link.
  var START_DATE = "2026-09-14";

  // Special dates that get their own banner instead of / above the usual
  // daily line, every year, automatically. Key is "MM-DD".
  var BONUS_DATES = {
    "02-14": "Happy anniversary, Honeybee — the whole garden blooms a little brighter today.",
    "12-28": "Happy birthday, pretty girl — every flower in this garden started the day you did."
  };

  // The 100 things. One per day, in order — Day 1 is index 0.
  // Everything below is a placeholder so you can see how it will look.
  // Replace each line with your own reason. Keep them short — one feeling
  // or one specific memory reads better than a paragraph. For example:
  //   "The way you make ordinary Tuesdays feel like something good is happening."
  var THINGS = [
    "I love how empathetic you are — like the time you cried after learning how humans abandoned pigeons."
  ];
  for (var i = THINGS.length + 1; i <= 100; i++) {
    THINGS.push("Reason #" + i + " — write your own line here.");
  }

  /* ===================== everything below just runs ===================== */

  function pad(n){ return n < 10 ? "0" + n : "" + n; }
  function toDateKey(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function startOfDay(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

  var today = startOfDay(new Date());
  var startParts = START_DATE.split("-").map(Number);
  var start = startOfDay(new Date(startParts[0], startParts[1]-1, startParts[2]));
  var daysSince = Math.round((today - start) / 86400000) + 1;

  var currentDay = Math.max(1, Math.min(100, daysSince));
  var unlockedCount = Math.max(0, Math.min(100, daysSince));
  var hasStarted = daysSince >= 1;

  var mmdd = pad(today.getMonth()+1) + "-" + pad(today.getDate());
  var bonusMessage = BONUS_DATES[mmdd];

  var petName = PET_NAMES[Math.floor(Math.random() * PET_NAMES.length)];
  document.getElementById("greeting").textContent = "Hi, " + petName;

  var annNote = document.getElementById("annNote");
  annNote.textContent = hasStarted
    ? ("Day " + Math.min(daysSince, 100) + " of 100, for " + HER_NAME + ".")
    : ("Your first bloom opens " + start.toLocaleDateString(undefined, {month:"long", day:"numeric"}) + ".");

  var bonusBanner = document.getElementById("bonusBanner");
  if (bonusMessage) {
    bonusBanner.textContent = bonusMessage;
    bonusBanner.hidden = false;
  }

  /* ---- streak (a fun bonus number only — never gates any content) ---- */

  var streak = 1;
  try {
    var raw = window.localStorage.getItem("marsGarden");
    var saved = raw ? JSON.parse(raw) : null;
    var todayKey = toDateKey(today);
    var yesterdayKey = toDateKey(new Date(today.getTime() - 86400000));
    if (saved && saved.lastVisit === todayKey) {
      streak = saved.streak || 1;
    } else if (saved && saved.lastVisit === yesterdayKey) {
      streak = (saved.streak || 0) + 1;
    } else {
      streak = 1;
    }
    window.localStorage.setItem("marsGarden", JSON.stringify({ lastVisit: todayKey, streak: streak }));
  } catch (e) { /* private window / storage blocked — streak just shows 1 */ }

  /* ---- flower artwork ---- */

  function petals(cx, cy, tipY, opts){
    opts = opts || {};
    var out = "";
    for (var k = 0; k < 5; k++){
      var rot = k * 72;
      out += '<path transform="rotate(' + rot + ' ' + cx + ' ' + cy + ')" ' +
        'd="M' + cx + ',' + cy + ' C' + (cx-6) + ',' + (cy-8) + ' ' + (cx-9) + ',' + (tipY+9) + ' ' + cx + ',' + tipY +
        ' C' + (cx+9) + ',' + (tipY+9) + ' ' + (cx+6) + ',' + (cy-8) + ' ' + cx + ',' + cy + ' Z" ' +
        'fill="' + (opts.fill || 'none') + '" stroke="' + (opts.stroke || 'none') + '" stroke-width="' + (opts.strokeWidth || 0) + '"/>';
    }
    return out;
  }

  // small bloomed flower, used in the garden grid
  var bloomGridSvg = '<svg viewBox="0 0 24 24">' + petals(12, 12, 3, { fill: '#f2a9b5' }) +
    '<circle cx="12" cy="12" r="2" fill="#eab54c"/></svg>';

  // small closed bud, used in the garden grid for days still to come
  var budGridSvg = '<svg viewBox="0 0 24 24">' +
    '<path d="M12,20 C9,17 9,9 12,4 C15,9 15,17 12,20 Z" fill="none" stroke="#7d7059" stroke-width="1.3"/></svg>';

  // large hero flower for today's card
  function heroFlowerSvg(){
    var s = '<svg class="flower-hero" viewBox="0 0 120 120" aria-hidden="true">';
    s += petals(60, 60, 16, { fill: '#f2a9b5' });
    for (var k = 0; k < 5; k++){
      var rot = 36 + k * 72;
      s += '<line transform="rotate(' + rot + ' 60 60)" x1="60" y1="60" x2="60" y2="34" stroke="#fff" stroke-width="1" opacity="0.5"/>';
    }
    for (var k2 = 0; k2 < 5; k2++){
      var rot2 = k2 * 72;
      s += '<line transform="rotate(' + rot2 + ' 60 60)" x1="60" y1="60" x2="60" y2="18" stroke="#e2788a" stroke-width="1" opacity="0.4"/>';
    }
    s += '<line x1="60" y1="66" x2="60" y2="104" stroke="#3f6b34" stroke-width="3" stroke-linecap="round"/>';
    s += '<path d="M60,82 C70,78 78,86 68,94 C64,92 60,86 60,82 Z" fill="#3f6b34"/>';
    s += '<path d="M60,96 C50,92 42,100 52,108 C56,106 60,100 60,96 Z" fill="#3f6b34"/>';
    s += '<circle cx="60" cy="60" r="6" fill="#eab54c"/>';
    s += '</svg>';
    return s;
  }

  /* ---- today panel ---- */

  var tonightContent = document.getElementById("tonightContent");

  if (!hasStarted) {
    tonightContent.innerHTML = '<div class="coming-soon">The garden hasn\'t opened yet. Come back soon.</div>';
  } else {
    var milestone = { 25:"a quarter of the garden has bloomed", 50:"half the garden is in bloom", 75:"three quarters bloomed, almost full", 100:"the whole garden is in bloom" }[currentDay];

    var sproutSvg = '<svg viewBox="0 0 24 24" fill="none"><path d="M12 21V11" stroke="#3f6b34" stroke-width="1.8" stroke-linecap="round"/>' +
      '<path d="M12 11c0-4 4-5 6-5-1 4-3 6-6 6z" fill="#3f6b34"/>' +
      '<path d="M12 14c0-3-3-4-5-4 1 3 3 5 5 5z" fill="#3f6b34"/></svg>';

    var budHeroSvg = '<svg class="bud-hero" viewBox="0 0 120 120" aria-hidden="true">' +
      '<line x1="60" y1="70" x2="60" y2="108" stroke="#3f6b34" stroke-width="3" stroke-linecap="round"/>' +
      '<path d="M60,86 C70,82 78,90 68,98 C64,96 60,90 60,86 Z" fill="#3f6b34"/>' +
      '<path d="M60,100 C50,96 42,104 52,112 C56,110 60,104 60,100 Z" fill="#3f6b34"/>' +
      '<path d="M60,70 C48,58 48,32 60,14 C72,32 72,58 60,70 Z" fill="none" stroke="#e2788a" stroke-width="2.4"/>' +
      '</svg>';

    var html = '';
    html += '<div class="status-row">';
    html += '<span class="pill">' + sproutSvg + ' ' + streak + '-day streak</span>';
    html += '</div>';
    html += '<div class="today-card">';
    html += '<button type="button" class="reveal-trigger" id="revealBtn">';
    html += budHeroSvg;
    html += '<p class="day-count">Day ' + currentDay + ' of 100</p>';
    html += '<p class="cta">Click here to bloom today’s reason 🌱</p>';
    html += '</button>';
    html += '<div class="reveal-content" id="revealContent" hidden>';
    html += heroFlowerSvg();
    if (milestone) {
      html += '<span class="milestone-flag">' + milestone + '</span><br>';
    }
    html += '<p class="day-count">Day ' + currentDay + ' of 100</p>';
    html += '<p class="thing">' + THINGS[currentDay - 1] + '</p>';
    html += '<p class="hint">Tomorrow, another one blooms.</p>';
    html += '</div>';
    html += '</div>';
    tonightContent.innerHTML = html;

    document.getElementById("revealBtn").addEventListener("click", function(){
      document.getElementById("revealBtn").hidden = true;
      document.getElementById("revealContent").hidden = false;
    });
  }

  /* ---- garden panel ---- */

  document.getElementById("skyProgress").textContent = unlockedCount + " of 100 have bloomed";
  document.getElementById("legendBloom").innerHTML = bloomGridSvg + " already bloomed";
  document.getElementById("legendBud").innerHTML = budGridSvg + " still a bud";

  var grid = document.getElementById("constellationGrid");
  var detail = document.getElementById("dayDetail");
  var detailDayCount = document.getElementById("detailDayCount");
  var detailThing = document.getElementById("detailThing");
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  for (var d = 1; d <= 100; d++) {
    var lit = d <= unlockedCount;
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "star-node " + (lit ? "lit" : "locked");
    btn.innerHTML = lit ? bloomGridSvg : budGridSvg;
    btn.setAttribute("aria-label", lit ? ("Day " + d + " — open") : ("Day " + d + " — still a bud"));
    if (!lit) { btn.disabled = true; }
    (function(day, isLit){
      btn.addEventListener("click", function(){
        if (!isLit) return;
        detailDayCount.textContent = "Day " + day + " of 100";
        detailThing.textContent = THINGS[day - 1];
        detail.hidden = false;
        detail.focus();
        if (!reduceMotion) { detail.scrollIntoView({ behavior: "smooth", block: "center" }); }
        else { detail.scrollIntoView(); }
      });
    })(d, lit);
    grid.appendChild(btn);
  }

  document.getElementById("detailClose").addEventListener("click", function(){
    detail.hidden = true;
  });

  /* ---- tabs ---- */

  var tabTonight = document.getElementById("tabTonight");
  var tabGarden = document.getElementById("tabGarden");
  var panelTonight = document.getElementById("panelTonight");
  var panelGarden = document.getElementById("panelGarden");

  function showTonight(){
    tabTonight.setAttribute("aria-selected", "true");
    tabGarden.setAttribute("aria-selected", "false");
    panelTonight.hidden = false;
    panelGarden.hidden = true;
  }
  function showGarden(){
    tabTonight.setAttribute("aria-selected", "false");
    tabGarden.setAttribute("aria-selected", "true");
    panelTonight.hidden = true;
    panelGarden.hidden = false;
  }
  tabTonight.addEventListener("click", showTonight);
  tabGarden.addEventListener("click", showGarden);

  /* ---- ambient falling petals (canvas, respects reduced motion) ---- */

  var canvas = document.createElement("canvas");
  document.getElementById("ambient").appendChild(canvas);
  var ctx = canvas.getContext("2d");
  var petalsList = [];

  function resize(){
    var w = window.innerWidth, h = window.innerHeight;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var count = Math.max(16, Math.min(40, Math.round((w * h) / 28000)));
    petalsList = [];
    for (var i = 0; i < count; i++) {
      petalsList.push({
        baseX: Math.random() * w,
        baseY: Math.random() * h,
        span: h + 80,
        speed: Math.random() * 0.012 + 0.006,
        swayAmp: Math.random() * 20 + 10,
        swaySpeed: Math.random() * 0.0012 + 0.0006,
        phase: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() * 0.0015 + 0.0005) * (Math.random() < 0.5 ? -1 : 1),
        rx: Math.random() * 2 + 4,
        ry: Math.random() * 1.5 + 2.5,
        pink: Math.random() < 0.7,
        opacity: Math.random() * 0.3 + 0.45
      });
    }
    draw(0);
  }

  function draw(t){
    var w = canvas.clientWidth, h = canvas.clientHeight;
    ctx.clearRect(0, 0, w, h);
    for (var i = 0; i < petalsList.length; i++) {
      var p = petalsList[i];
      var y = reduceMotion ? p.baseY : ((p.baseY + t * p.speed) % p.span) - 40;
      var x = reduceMotion ? p.baseX : p.baseX + Math.sin(t * p.swaySpeed + p.phase) * p.swayAmp;
      var rot = reduceMotion ? p.phase : t * p.rotSpeed + p.phase;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);
      ctx.beginPath();
      ctx.ellipse(0, 0, p.rx, p.ry, 0, 0, Math.PI * 2);
      ctx.fillStyle = p.pink ? "rgba(242,169,181," + p.opacity + ")" : "rgba(255,255,255," + p.opacity + ")";
      ctx.fill();
      ctx.restore();
    }
  }

  var resizeTimer;
  window.addEventListener("resize", function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 150);
  });

  resize();

  if (!reduceMotion) {
    (function loop(t){
      draw(t);
      requestAnimationFrame(loop);
    })(0);
  }

})();
</script>
